---
- name: Check Apache Status
  hosts: webservers
  become: yes
  vars:
    distrib: "{{ ansible_facts['distribution'] }}"
    distrib_vers: "{{ ansible_facts['distribution_version'] }}"
    ip: "{{ ansible_facts['all_ipv4_addresses'][0] }}"
  tasks:

#Visualizzazione Sistema Operativo
    - name: Nome SO
      debug:
        msg: "SO: {{ distrib }}"

#Visualizzazione Versione Sistema Operativo
    - name: Versione SO
      debug:
        msg: "Versione {{ distrib }}: {{ distrib_vers }}"

#Visualizzazione IP del server remoto
    - name: Indirizzo IP
      debug:
        msg: "IP: {{ ip }}"

#Ricerca pacchetti installati e visualizzazione tipo di webserver
    - name: Raccolta pacchetti installati
        ansible.builtin.package_facts:
          manager: "auto"
    
    - name: Visualizzazione  Webserver
      debug:
        msg: "Webserver: Apache"
      when: "'apache2' in ansible_facts.packages or 'httpd' in ansible_facts.packages"


    - name: Versione Webserver
      command: apache2 -v
      register: apache_version
  
    - name: Visualizzazione Versione Webserver
      debug:
        msg: "Versione WebServer: {{ apache_version.stdout | regex_search('Apache/([0-9.]+)', '\\1')}}"

#Verifica del configurazione di Apache
    - name: Verifica Configurazione di Apache
      command: apachectl configtest
      changed_when: false
      register: apache_checkconfig

    - name: Validazione configurazione Apache
      debug:
        msg: "La configurazione di Apache è corretta."
      when: apache_checkconfig.rc == 0

#Verifica stato del servizio Apache 
    - name: Verifica servizio Apache
      systemd:
        name: apache2
      register: apache_status
      
#Visualizzazione stato del servizio Apache
    - name: Visualizzazione stato servizio Apache
      debug:
        msg: "Il servizio di Apache è: {{ apache_status.status.ActiveState }}"

#Verifica dello stato del sito web
    - name: Verifica Risposta HTTP sito web 
      ansible.builtin.uri:
        url: "http://{{ ip }}"
        status_code: 200
        method: GET
      register: web_check

    - name: Visualizzazione risposta sito web
      debug:
        msg: "La risposta del sito web è: {{ web_check.status }}"
  
